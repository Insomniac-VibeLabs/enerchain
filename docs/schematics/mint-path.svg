<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" font-family="ui-sans-serif,sans-serif">
  <rect width="1180" height="620" fill="#f7f4ee"/>
  <text x="24" y="32" font-size="16" fill="#111" text-anchor="start">Enerchain mint path — EC-SEAL1 revision B</text>
  <text x="24" y="52" font-size="12" fill="#444" text-anchor="start">One sealed board per meter, two meters per site. Ground is Line at the shunt. EC-SEAL1 rev B, doc-1.4.</text>
  <text x="40" y="98" font-size="11" fill="#444" text-anchor="start">generator</text>
  <text x="1100" y="98" font-size="11" fill="#444" text-anchor="end">grid</text>
  <line x1="40" y1="110" x2="1140" y2="110" stroke="#111" stroke-width="3"/>
  <text x="40" y="126" font-size="11" fill="#111" text-anchor="start">L</text>
  <line x1="40" y1="190" x2="1140" y2="190" stroke="#111" stroke-width="2"/>
  <text x="40" y="206" font-size="11" fill="#111" text-anchor="start">N</text>
  <rect x="240" y="96" width="100" height="28" fill="#fff" stroke="#111" stroke-width="1.2"/>
  <text x="290" y="115" font-size="11" fill="#111" text-anchor="middle">RS 100 µΩ</text>
  <text x="400" y="104" font-size="10" fill="#444" text-anchor="start">grid-side force pad = GND</text>
  <rect x="60" y="250" width="170" height="80" fill="#fffdf8" stroke="#111" stroke-width="1.2"/>
  <text x="145" y="268" font-size="12" fill="#111" text-anchor="middle" font-weight="600">supply (sheet 01)</text>
  <text x="145" y="286" font-size="10" fill="#444" text-anchor="middle">F1, RV1, LNK304 → 12 V</text>
  <text x="145" y="301" font-size="10" fill="#444" text-anchor="middle">LM2936 → 3.3 V, ≤ 2 W</text>
  <rect x="280" y="250" width="170" height="80" fill="#fffdf8" stroke="#111" stroke-width="1.2"/>
  <text x="365" y="268" font-size="12" fill="#111" text-anchor="middle" font-weight="600">divider (sheet 03)</text>
  <text x="365" y="286" font-size="10" fill="#444" text-anchor="middle">4 × 499 k / 1 k from N</text>
  <text x="365" y="301" font-size="10" fill="#444" text-anchor="middle">0.120 V rms at 240 V</text>
  <rect x="500" y="250" width="190" height="80" fill="#fffdf8" stroke="#111" stroke-width="1.2"/>
  <text x="595" y="268" font-size="12" fill="#111" text-anchor="middle" font-weight="600">STPM32 (sheet 04)</text>
  <text x="595" y="286" font-size="10" fill="#444" text-anchor="middle">Σ v·i·Δt, both directions</text>
  <text x="595" y="301" font-size="10" fill="#444" text-anchor="middle">LED1 export, LED2 import</text>
  <rect x="740" y="250" width="200" height="110" fill="#fffdf8" stroke="#111" stroke-width="1.2"/>
  <text x="840" y="268" font-size="12" fill="#111" text-anchor="middle" font-weight="600">EC-MINT1 (sheet 05)</text>
  <text x="840" y="286" font-size="10" fill="#444" text-anchor="middle">1 Wh per pulse</text>
  <text x="840" y="301" font-size="10" fill="#444" text-anchor="middle">1000 Wh net export = 1 token</text>
  <text x="840" y="316" font-size="10" fill="#444" text-anchor="middle">record for every token</text>
  <text x="840" y="331" font-size="10" fill="#444" text-anchor="middle">F-RAM: counters, image</text>
  <rect x="990" y="250" width="160" height="80" fill="#fffdf8" stroke="#111" stroke-width="1.2"/>
  <text x="1070" y="268" font-size="12" fill="#111" text-anchor="middle" font-weight="600">QS7001 (sheet 05)</text>
  <text x="1070" y="286" font-size="10" fill="#444" text-anchor="middle">ML-DSA-44 key, on chip</text>
  <text x="1070" y="301" font-size="10" fill="#444" text-anchor="middle">rollback guard</text>
  <rect x="740" y="420" width="200" height="70" fill="#fffdf8" stroke="#111" stroke-width="1.2"/>
  <text x="840" y="438" font-size="12" fill="#111" text-anchor="middle" font-weight="600">tamper latch (sheet 06)</text>
  <text x="840" y="456" font-size="10" fill="#444" text-anchor="middle">ZEROIZE → erase, rail off</text>
  <rect x="500" y="420" width="190" height="70" fill="#fffdf8" stroke="#111" stroke-width="1.2"/>
  <text x="595" y="438" font-size="12" fill="#111" text-anchor="middle" font-weight="600">radio (sheet 07)</text>
  <text x="595" y="456" font-size="10" fill="#444" text-anchor="middle">TX only, 2454 B per kWh</text>
  <line x1="145" y1="190" x2="145" y2="250" stroke="#111" stroke-width="1.2"/>
  <text x="150" y="230" font-size="9" fill="#444" text-anchor="start">fused N</text>
  <line x1="365" y1="190" x2="365" y2="250" stroke="#111" stroke-width="1.2"/>
  <line x1="290" y1="124" x2="290" y2="150" stroke="#111" stroke-width="1.2"/>
  <polyline points="290,150 595,150 595,250" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="450" y="145" font-size="9" fill="#444" text-anchor="start">Kelvin pair (sheet 02)</text>
  <line x1="450" y1="290" x2="500" y2="290" stroke="#111" stroke-width="1.2"/>
  <line x1="690" y1="280" x2="740" y2="280" stroke="#111" stroke-width="1.2"/>
  <text x="715" y="274" font-size="8" fill="#a33" text-anchor="middle">CF_EXP</text>
  <line x1="690" y1="305" x2="740" y2="305" stroke="#111" stroke-width="1.2"/>
  <text x="715" y="320" font-size="8" fill="#a33" text-anchor="middle">CF_IMP</text>
  <line x1="940" y1="290" x2="990" y2="290" stroke="#111" stroke-width="1.2"/>
  <text x="965" y="284" font-size="9" fill="#444" text-anchor="middle">SPI</text>
  <polyline points="840,360 840,420" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="846" y="395" font-size="9" fill="#a33" text-anchor="start">ZEROIZE</text>
  <polyline points="940,455 1070,455 1070,330" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="1000" y="450" font-size="9" fill="#a33" text-anchor="start">ZEROIZE</text>
  <polyline points="760,360 760,390 595,390 595,420" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="680" y="385" font-size="9" fill="#444" text-anchor="start">UART</text>
  <text x="40" y="530" font-size="12" fill="#111" text-anchor="start">GEN board at the generator terminals, GRID board at the connection. Each signs its own cumulative record for every token.</text>
  <text x="40" y="549" font-size="12" fill="#111" text-anchor="start">The ledger verifies both and credits min(T_GEN, T_GRID) less what it already credited: one token per kWh delivered net.</text>
  <text x="40" y="568" font-size="12" fill="#111" text-anchor="start">An optional LOAD board on the site's own load mints nothing; it lets the ledger check GEN = GRID + LOAD and flag a tap between them.</text>
  <text x="40" y="587" font-size="12" fill="#111" text-anchor="start">No host CPU in the path. Ledger nodes only verify and chain (SHA-384); there is no difficulty and no hash contest.</text>
</svg>
