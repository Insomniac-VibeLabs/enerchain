  <text x="400" y="144" font-size="11" fill="#111" text-anchor="middle">RS 100 µΩ</text>
  <text x="340" y="120" font-size="9" fill="#444" text-anchor="start">FG</text>
  <text x="450" y="120" font-size="9" fill="#444" text-anchor="start">IG</text>
  <line x1="470" y1="140" x2="760" y2="140" stroke="#111" stroke-width="3"/>
  <circle cx="765" cy="140" r="5" fill="none" stroke="#111" stroke-width="1.4"/>
  <text x="765" y="130" font-size="11" fill="#111" text-anchor="middle">H1 grid Line = GND</text>
  <line x1="620" y1="140" x2="620" y2="146" stroke="#111" stroke-width="1.2"/>
