  <line x1="618" y1="154" x2="622" y2="154" stroke="#111" stroke-width="1.6"/>
  <polygon points="230,132 245,140 230,148" fill="#a33" stroke="#a33" stroke-width="1.2"/>
  <text x="238" y="126" font-size="10" fill="#a33" text-anchor="middle">export current i</text>
  <line x1="360" y1="154" x2="360" y2="230" stroke="#111" stroke-width="1.2"/>
  <text x="366" y="170" font-size="9" fill="#444" text-anchor="start">SG</text>
  <line x1="440" y1="154" x2="440" y2="300" stroke="#111" stroke-width="1.2"/>
  <text x="446" y="170" font-size="9" fill="#444" text-anchor="start">SI</text>
  <line x1="360" y1="230" x2="480" y2="230" stroke="#111" stroke-width="1.2"/>
  <line x1="480" y1="230" x2="493" y2="230" stroke="#111" stroke-width="1.2"/>
  <line x1="527" y1="230" x2="540" y2="230" stroke="#111" stroke-width="1.2"/>
  <rect x="493" y="224" width="34" height="12" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="510" y="218" font-size="11" fill="#111" text-anchor="middle">R11</text>
  <text x="510" y="252" font-size="10" fill="#444" text-anchor="middle">100 Ω 0.1 %</text>
  <line x1="540" y1="230" x2="600" y2="230" stroke="#111" stroke-width="1.2"/>
  <line x1="440" y1="300" x2="480" y2="300" stroke="#111" stroke-width="1.2"/>
  <line x1="480" y1="300" x2="493" y2="300" stroke="#111" stroke-width="1.2"/>
  <line x1="527" y1="300" x2="540" y2="300" stroke="#111" stroke-width="1.2"/>
  <rect x="493" y="294" width="34" height="12" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="510" y="288" font-size="11" fill="#111" text-anchor="middle">R10</text>
  <text x="510" y="322" font-size="10" fill="#444" text-anchor="middle">100 Ω 0.1 %</text>
  <line x1="540" y1="300" x2="600" y2="300" stroke="#111" stroke-width="1.2"/>
  <circle cx="575" cy="230" r="2.6" fill="#111"/>
  <circle cx="575" cy="300" r="2.6" fill="#111"/>
  <line x1="575" y1="235" x2="575" y2="261" stroke="#111" stroke-width="1.2"/>
  <line x1="575" y1="269" x2="575" y2="295" stroke="#111" stroke-width="1.2"/>
  <line x1="564" y1="261" x2="586" y2="261" stroke="#111" stroke-width="2"/>
  <line x1="564" y1="269" x2="586" y2="269" stroke="#111" stroke-width="2"/>
  <text x="563" y="263" font-size="11" fill="#111" text-anchor="end">C6</text>
  <text x="563" y="276" font-size="10" fill="#444" text-anchor="end">10 nF C0G</text>
  <text x="585" y="217" font-size="10" fill="#111" text-anchor="middle">IIN</text>
  <text x="585" y="332" font-size="10" fill="#111" text-anchor="middle">IIP</text>
  <rect x="610" y="200" width="150" height="120" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="685" y="216" font-size="12" fill="#111" text-anchor="middle" font-weight="600">U2</text>
  <text x="685" y="230" font-size="10" fill="#444" text-anchor="middle">STPM32</text>
  <line x1="600" y1="230" x2="610" y2="230" stroke="#111" stroke-width="1.2"/>
  <text x="614" y="234" font-size="9" fill="#111" text-anchor="start">IIN1</text>
  <line x1="600" y1="300" x2="610" y2="300" stroke="#111" stroke-width="1.2"/>
  <text x="614" y="304" font-size="9" fill="#111" text-anchor="start">IIP1</text>
  <text x="40" y="380" font-size="12" fill="#111" text-anchor="start">At 40 A: v = I·R = 4.0 mV rms, 5.66 mV peak; burden I²R = 0.16 W.</text>
  <text x="40" y="399" font-size="12" fill="#111" text-anchor="start">Gain 16: 91 mV peak at the modulator against ±300 mV; clips near 133 A rms.</text>
  <text x="40" y="418" font-size="12" fill="#111" text-anchor="start">R10 + R11 with C6: differential pole ≈ 80 kHz.</text>
  <text x="40" y="437" font-size="12" fill="#111" text-anchor="start">Export flows FG → IG, so V(SG) − V(SI) = +i·R and IIP1 − IIN1 = −i·R. With the divider</text>
  <text x="40" y="456" font-size="12" fill="#111" text-anchor="start">reading −v (sheet 03) the STPM32 sees (−v)(−i) = +p: export is positive active power.</text>
  <text x="40" y="475" font-size="12" fill="#111" text-anchor="start">The Kelvin pair leaves the element at SG and SI and shares no copper with the force path.</text>
</svg>
