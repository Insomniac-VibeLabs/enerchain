<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="ui-sans-serif,sans-serif">
  <rect width="960" height="520" fill="#f7f4ee"/>
  <text x="24" y="32" font-size="16" fill="#111" text-anchor="start">02 — Current shunt, Kelvin sense into the STPM32</text>
  <text x="24" y="52" font-size="12" fill="#444" text-anchor="start">Four-terminal 100 µΩ shunt in Line. Ground is its grid-side force pad. EC-SEAL1 rev B, doc-1.3.</text>
  <circle cx="90" cy="140" r="5" fill="none" stroke="#111" stroke-width="1.4"/>
  <text x="90" y="130" font-size="11" fill="#111" text-anchor="middle">H2 L_GEN (generator)</text>
  <line x1="95" y1="140" x2="330" y2="140" stroke="#111" stroke-width="3"/>
