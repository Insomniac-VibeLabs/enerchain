<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="ui-sans-serif,sans-serif">
  <rect width="1100" height="640" fill="#f7f4ee"/>
  <text x="24" y="32" font-size="16" fill="#111" text-anchor="start">05 — Schedule die and signer: EC-MINT1, FM25V02A F-RAM, QS7001</text>
  <text x="24" y="52" font-size="12" fill="#444" text-anchor="start">U3 counts, builds and persists; U4 signs. Each has one master on its SPI: U3. EC-SEAL1 rev B, doc-1.3.</text>
  <rect x="380" y="120" width="340" height="300" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="550" y="136" font-size="12" fill="#111" text-anchor="middle" font-weight="600">U3</text>
  <text x="550" y="150" font-size="10" fill="#444" text-anchor="middle">EC-MINT1 schedule die</text>
  <line x1="370" y1="170" x2="380" y2="170" stroke="#111" stroke-width="1.2"/>
  <text x="384" y="174" font-size="9" fill="#111" text-anchor="start">CF_EXP</text>
  <line x1="370" y1="200" x2="380" y2="200" stroke="#111" stroke-width="1.2"/>
  <text x="384" y="204" font-size="9" fill="#111" text-anchor="start">CF_IMP</text>
  <line x1="370" y1="240" x2="380" y2="240" stroke="#111" stroke-width="1.2"/>
  <text x="384" y="244" font-size="9" fill="#111" text-anchor="start">ZEROIZE</text>
  <line x1="370" y1="280" x2="380" y2="280" stroke="#111" stroke-width="1.2"/>
  <text x="384" y="284" font-size="9" fill="#111" text-anchor="start">XI</text>
  <line x1="370" y1="310" x2="380" y2="310" stroke="#111" stroke-width="1.2"/>
  <text x="384" y="314" font-size="9" fill="#111" text-anchor="start">RST_N</text>
  <line x1="370" y1="350" x2="380" y2="350" stroke="#111" stroke-width="1.2"/>
  <text x="384" y="354" font-size="9" fill="#111" text-anchor="start">STP_*</text>
  <line x1="370" y1="390" x2="380" y2="390" stroke="#111" stroke-width="1.2"/>
  <text x="384" y="394" font-size="9" fill="#111" text-anchor="start">PROV_*</text>
  <line x1="720" y1="170" x2="730" y2="170" stroke="#111" stroke-width="1.2"/>
  <text x="716" y="174" font-size="9" fill="#111" text-anchor="end">QS_SCK/MOSI/MISO</text>
  <line x1="720" y1="200" x2="730" y2="200" stroke="#111" stroke-width="1.2"/>
  <text x="716" y="204" font-size="9" fill="#111" text-anchor="end">QS_CS_N</text>
  <line x1="720" y1="230" x2="730" y2="230" stroke="#111" stroke-width="1.2"/>
  <text x="716" y="234" font-size="9" fill="#111" text-anchor="end">QS_RST_N</text>
  <line x1="720" y1="310" x2="730" y2="310" stroke="#111" stroke-width="1.2"/>
  <text x="716" y="314" font-size="9" fill="#111" text-anchor="end">FR_SCK/MOSI/MISO</text>
  <line x1="720" y1="340" x2="730" y2="340" stroke="#111" stroke-width="1.2"/>
  <text x="716" y="344" font-size="9" fill="#111" text-anchor="end">FR_CS_N</text>
  <line x1="720" y1="390" x2="730" y2="390" stroke="#111" stroke-width="1.2"/>
  <text x="716" y="394" font-size="9" fill="#111" text-anchor="end">UART_TX</text>
  <text x="540" y="200" font-size="11" fill="#111" text-anchor="middle">credit = e_exp − e_imp − 1000·tokens</text>
  <text x="540" y="218" font-size="10" fill="#444" text-anchor="middle">export: credit+1; at 1000 → tokens+1, credit 0</text>
  <text x="540" y="234" font-size="10" fill="#444" text-anchor="middle">import: credit−1</text>
  <text x="540" y="254" font-size="10" fill="#a33" text-anchor="middle">every token (1 kWh): build and sign one record</text>
  <text x="540" y="270" font-size="10" fill="#444" text-anchor="middle">no host write port; 48-bit cumulative</text>
  <line x1="330" y1="170" x2="370" y2="170" stroke="#111" stroke-width="1.2"/>
  <text x="326" y="174" font-size="10" fill="#444" text-anchor="end">from Q1 (sheet 04)</text>
  <line x1="330" y1="200" x2="370" y2="200" stroke="#111" stroke-width="1.2"/>
  <text x="326" y="204" font-size="10" fill="#444" text-anchor="end">from Q6 (sheet 04)</text>
  <line x1="330" y1="240" x2="370" y2="240" stroke="#111" stroke-width="1.2"/>
  <text x="326" y="244" font-size="10" fill="#444" text-anchor="end">from latch (sheet 06)</text>
  <line x1="330" y1="350" x2="370" y2="350" stroke="#111" stroke-width="1.2"/>
  <text x="326" y="354" font-size="10" fill="#444" text-anchor="end">STPM32 SPI + EN</text>
  <line x1="330" y1="390" x2="370" y2="390" stroke="#111" stroke-width="1.2"/>
  <text x="326" y="394" font-size="10" fill="#444" text-anchor="end">J5 factory row, under the mesh</text>
  <line x1="310" y1="280" x2="370" y2="280" stroke="#111" stroke-width="1.2"/>
  <rect x="250" y="266" width="60" height="28" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="280" y="284" font-size="10" fill="#111" text-anchor="middle">Y2</text>
  <text x="280" y="260" font-size="9" fill="#444" text-anchor="middle">16.000 MHz CMOS</text>
  <line x1="330" y1="310" x2="370" y2="310" stroke="#111" stroke-width="1.2"/>
  <text x="326" y="314" font-size="10" fill="#444" text-anchor="end">R24 100 k to VDD</text>
  <rect x="810" y="100" width="180" height="150" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="900" y="116" font-size="12" fill="#111" text-anchor="middle" font-weight="600">U4</text>
  <text x="900" y="130" font-size="10" fill="#444" text-anchor="middle">QS7001 ML-DSA-44</text>
  <line x1="800" y1="150" x2="810" y2="150" stroke="#111" stroke-width="1.2"/>
  <text x="814" y="154" font-size="9" fill="#111" text-anchor="start">SPI_CLK/MOSI/MISO</text>
  <line x1="800" y1="180" x2="810" y2="180" stroke="#111" stroke-width="1.2"/>
  <text x="814" y="184" font-size="9" fill="#111" text-anchor="start">SPI_CS</text>
  <line x1="800" y1="210" x2="810" y2="210" stroke="#111" stroke-width="1.2"/>
  <text x="814" y="214" font-size="9" fill="#111" text-anchor="start">RST</text>
  <line x1="990" y1="180" x2="1000" y2="180" stroke="#111" stroke-width="1.2"/>
  <text x="986" y="184" font-size="9" fill="#111" text-anchor="end">GPIO3</text>
  <line x1="990" y1="210" x2="1000" y2="210" stroke="#111" stroke-width="1.2"/>
  <text x="986" y="214" font-size="9" fill="#111" text-anchor="end">VCC</text>
  <line x1="730" y1="170" x2="800" y2="150" stroke="#111" stroke-width="1.2"/>
  <line x1="730" y1="200" x2="800" y2="180" stroke="#111" stroke-width="1.2"/>
  <line x1="730" y1="230" x2="800" y2="210" stroke="#111" stroke-width="1.2"/>
  <text x="765" y="246" font-size="9" fill="#444" text-anchor="middle">R25 100 k pull-up</text>
  <text x="1004" y="184" font-size="10" fill="#a33" text-anchor="start">ZEROIZE</text>
  <text x="1004" y="214" font-size="10" fill="#444" text-anchor="start">QS_VDD</text>
  <text x="1004" y="227" font-size="9" fill="#444" text-anchor="start">(sheet 06)</text>
  <rect x="810" y="280" width="180" height="90" fill="none" stroke="#111" stroke-width="1.2"/>
  <text x="900" y="296" font-size="12" fill="#111" text-anchor="middle" font-weight="600">U6</text>
  <text x="900" y="310" font-size="10" fill="#444" text-anchor="middle">FM25V02A F-RAM</text>
  <line x1="800" y1="310" x2="810" y2="310" stroke="#111" stroke-width="1.2"/>
  <text x="814" y="314" font-size="9" fill="#111" text-anchor="start">SCK/SI/SO</text>
  <line x1="800" y1="340" x2="810" y2="340" stroke="#111" stroke-width="1.2"/>
  <text x="814" y="344" font-size="9" fill="#111" text-anchor="start">/CS</text>
  <line x1="730" y1="310" x2="800" y2="310" stroke="#111" stroke-width="1.2"/>
  <line x1="730" y1="340" x2="800" y2="340" stroke="#111" stroke-width="1.2"/>
  <text x="900" y="360" font-size="9" fill="#444" text-anchor="middle">/WP, /HOLD high; C20 100 nF</text>
  <line x1="730" y1="390" x2="780" y2="390" stroke="#111" stroke-width="1.2"/>
  <text x="784" y="394" font-size="10" fill="#444" text-anchor="start">→ R26 → J4.4, radio (sheet 07)</text>
  <text x="40" y="480" font-size="12" fill="#111" text-anchor="start">q = 1000 Wh: one token per kWh of net export, and a record for every token, so each kWh is signed and credited on its own.</text>
  <text x="40" y="499" font-size="12" fill="#111" text-anchor="start">Record, 32 bytes: id, version/role, class 0x22, seq, e_exp, e_imp, tokens, CRC-16 of the calibration image.</text>
  <text x="40" y="518" font-size="12" fill="#111" text-anchor="start">Built when its token mints (credit = 0), so e_exp − e_imp = 1000·tokens exactly. Frame EC 01 + record + 2420 B = 2454 B.</text>
  <text x="40" y="537" font-size="12" fill="#111" text-anchor="start">One ML-DSA-44 sign ≈ 19 mJ against 3.6 MJ in the kWh it attests: 5.3 × 10⁻⁹ of the energy.</text>
  <text x="40" y="556" font-size="12" fill="#111" text-anchor="start">The QS7001 signs only records that advance its last signed (seq, e_exp, e_imp, tokens), with tokens·1000 ≤ e_exp.</text>
  <text x="40" y="575" font-size="12" fill="#111" text-anchor="start">Counters, seq and the image sit in F-RAM, two CRC-8 slots; a power cut loses at most the pulses since the last write.</text>
</svg>
