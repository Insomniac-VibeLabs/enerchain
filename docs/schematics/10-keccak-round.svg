<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
  <rect width="1100" height="640" fill="#f7f4ee"/>
  <text x="24" y="28" font-family="ui-sans-serif,sans-serif" font-size="16">10 — One Keccak-f1600 round, gate level</text>
  <text x="24" y="48" font-size="12" fill="#444">SHAKE256 inside ML-DSA is this permutation, 24 rounds. doc-0.8</text>
  <rect x="40" y="80" width="140" height="50" fill="none" stroke="#111"/><text x="78" y="110" font-size="13">state</text>
  <text x="70" y="146" font-size="11">5×5×64 bit</text>
  <line x1="180" y1="105" x2="230" y2="105" stroke="#111"/>
  <circle cx="250" cy="105" r="16" fill="none" stroke="#111"/><text x="242" y="110" font-size="12">⊕</text>
  <text x="230" y="80" font-size="11">θ column parity</text>
  <line x1="266" y1="105" x2="320" y2="105" stroke="#111"/>
  <rect x="320" y="84" width="90" height="42" fill="none" stroke="#111"/><text x="340" y="110" font-size="12">ρ rotate</text>
  <line x1="410" y1="105" x2="460" y2="105" stroke="#111"/>
  <rect x="460" y="84" width="80" height="42" fill="none" stroke="#111"/><text x="482" y="110" font-size="12">π perm</text>
  <line x1="540" y1="105" x2="600" y2="105" stroke="#111"/>
  <text x="600" y="80" font-size="12">χ — the only nonlinear gate</text>
  <line x1="40" y1="200" x2="200" y2="200" stroke="#111"/>
  <text x="44" y="192" font-size="11">a</text>
  <polygon points="200,200 230,188 230,212" fill="none" stroke="#111"/><text x="206" y="230" font-size="11">NOT</text>
  <line x1="230" y1="200" x2="280" y2="200" stroke="#111"/>
  <line x1="40" y1="250" x2="250" y2="250" stroke="#111"/>
  <text x="44" y="242" font-size="11">b</text>
  <rect x="250" y="232" width="50" height="36" fill="none" stroke="#111"/><text x="260" y="254" font-size="12">AND</text>
  <line x1="230" y1="200" x2="250" y2="250" stroke="#111"/>
  <line x1="300" y1="250" x2="360" y2="250" stroke="#111"/>
  <circle cx="380" cy="230" r="16" fill="none" stroke="#111"/><text x="372" y="235" font-size="12">⊕</text>
  <line x1="40" y1="210" x2="364" y2="230" stroke="#111"/>
  <text x="44" y="218" font-size="11">c</text>
  <line x1="396" y1="230" x2="460" y2="230" stroke="#111"/>
  <text x="468" y="234" font-size="12">a' = c ⊕ (¬a ∧ b)</text>
  <line x1="520" y1="105" x2="700" y2="300" stroke="#111"/>
  <circle cx="730" cy="300" r="16" fill="none" stroke="#111"/><text x="722" y="305" font-size="12">⊕</text>
  <rect x="760" y="280" width="120" height="40" fill="none" stroke="#111"/><text x="778" y="304" font-size="12">ι round const</text>
  <text x="24" y="380" font-size="13">θ, ρ, π, ι are wiring and XOR. χ is the AND-NOT-XOR above, one lane bit at a time, 1600 bits per round.</text>
  <text x="24" y="402" font-size="13">24 round constants are a ROM, not software. Address is the round counter, 0 to 23.</text>
  <text x="24" y="424" font-size="13">SHAKE256 is this permutation in sponge mode: absorb m, squeeze the challenge and the matrix seed.</text>
  <text x="24" y="480" font-size="12" fill="#444">FIPS 202 Keccak-f[1600]. Used by FIPS 204 ML-DSA. One round is drawn; the engine repeats it 24 times.</text>
</svg>
