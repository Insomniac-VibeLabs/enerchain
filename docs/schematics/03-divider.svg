  <text x="40" y="360" font-size="12" fill="#111" text-anchor="start">k = 1.00 k / (4 × 499 k + 1.00 k) = 1 / 1997. At 240 V rms the pin sees 0.120 V rms, 0.170 V peak.</text>
  <text x="40" y="379" font-size="12" fill="#111" text-anchor="start">At 264 V (+10 %): 0.187 V peak, inside the ±0.3 V VIP1/VIN1 window.</text>
  <text x="40" y="398" font-size="12" fill="#111" text-anchor="start">Each 499 k part drops 60 V rms, and 177.5 V at the MOV clamp (710 V), against a 700 V rating.</text>
  <text x="40" y="417" font-size="12" fill="#111" text-anchor="start">String dissipation V²/R = 29 mW. C5 across R8: anti-alias pole ≈ 16 kHz.</text>
  <text x="40" y="436" font-size="12" fill="#111" text-anchor="start">The divider measures V(N) − V(L) = −v_LN. That sign is what makes export positive (sheet 02).</text>
