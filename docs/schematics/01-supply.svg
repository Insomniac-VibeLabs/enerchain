  <text x="744" y="186" font-size="10">C3 10 µF</text>
  <text x="24" y="310" font-size="13" fill="#111">At 240 V, 50 Hz, X_C = 1/(2πfC) ≈ 14.5 kΩ, I ≈ 16 mA.</text>
  <text x="24" y="332" font-size="13" fill="#111">Zener dissipation ≈ 12 V × 16 mA ≈ 0.19 W. LDO out at 15 mA is 50 mW.</text>
  <text x="24" y="354" font-size="13" fill="#111">Tap is on the feeder side of the shunt, so this current is not in the minted integral.</text>
  <text x="24" y="400" font-size="12" fill="#444">F1 series fuse. MOV across the line. C1 must be an X2 safety capacitor. D1 clamps the rectified rail. U1 drops 12 V to 3.3 V.</text>
