<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480">
  <rect width="920" height="480" fill="#f7f4ee"/>
  <text x="24" y="32" font-family="ui-sans-serif,sans-serif" font-size="16" fill="#1a1a1a">06 — Tamper mesh</text>
  <text x="24" y="52" font-family="ui-sans-serif,sans-serif" font-size="12" fill="#444">Normally closed loop. Open circuit zeroizes the key. doc-0.7</text>
  <line x1="80" y1="140" x2="200" y2="140" stroke="#111"/>
  <text x="84" y="128" font-size="12">Vdd</text>
  <rect x="200" y="128" width="40" height="24" fill="none" stroke="#111"/>
  <text x="206" y="144" font-size="11">R3</text>
  <text x="196" y="168" font-size="10">100 kΩ</text>
  <line x1="240" y1="140" x2="360" y2="140" stroke="#111"/>
  <line x1="360" y1="120" x2="520" y2="120" stroke="#111"/>
  <line x1="360" y1="160" x2="520" y2="160" stroke="#111"/>
  <line x1="360" y1="120" x2="360" y2="160" stroke="#111"/>
  <line x1="520" y1="120" x2="520" y2="160" stroke="#111"/>
  <text x="400" y="146" font-size="12">mesh switch</text>
  <line x1="520" y1="140" x2="640" y2="140" stroke="#111"/>
  <line x1="640" y1="140" x2="640" y2="220" stroke="#111"/>
  <line x1="620" y1="220" x2="660" y2="220" stroke="#111"/>
  <line x1="628" y1="228" x2="652" y2="228" stroke="#111"/>
  <line x1="636" y1="236" x2="644" y2="236" stroke="#111"/>
  <text x="668" y="224" font-size="11">GND</text>
  <line x1="300" y1="140" x2="300" y2="280" stroke="#a33" stroke-width="1.6"/>
  <rect x="260" y="280" width="160" height="40" fill="none" stroke="#a33"/>
  <text x="276" y="304" font-size="12" fill="#a33">ZEROIZE</text>
  <text x="24" y="360" font-size="13">Closed mesh holds ZEROIZE high through R3. A cut or a lifted lid opens the loop.</text>
  <text x="24" y="382" font-size="13">The element treats a low ZEROIZE as key destruction, not as a warning.</text>
  <text x="24" y="404" font-size="13">Light and temperature sensors on the same pin are optional parallels of the mesh.</text>
</svg>
