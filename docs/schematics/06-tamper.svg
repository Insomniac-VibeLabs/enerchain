  <text x="40" y="520" font-size="11" fill="#111" text-anchor="start">Cover on: MESH = 3.3 V × 10 k / 110 k = 0.30 V. Q2 trips at MESH ≈ 0.6 V × (1 + 47 k/100 k) = 0.88 V.</text>
  <text x="40" y="538" font-size="11" fill="#111" text-anchor="start">Light on PT1 with the spring still closed: about 70 µA lifts MESH to the trip point. Latched, R21 feeds Q2 ≈ 264 µA;</text>
  <text x="40" y="556" font-size="11" fill="#111" text-anchor="start">closing the cover again can pull at most 13 µA back through R18, so the latch holds until power is removed.</text>
  <text x="40" y="574" font-size="11" fill="#111" text-anchor="start">ZEROIZE → U3 sends 5C 5C within microseconds. R22·C14 = 0.22 s: Q4 conducts from ≈ 0.22 s, Q5 opens at ≈ 0.29 s.</text>
  <text x="40" y="592" font-size="11" fill="#111" text-anchor="start">In that overlap R23 = 1 k limits the draw to 3.3 mA; once Q5 is open C15 discharges with τ = 0.1 ms. Unpowered tamper is O-1.</text>
