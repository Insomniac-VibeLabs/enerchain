  <text x="40" y="500" font-size="12" fill="#111" text-anchor="start">One LED edge is one watt-hour; 1000 net-export edges are one token (1 kWh) in U3. Q1 and Q6 turn each LED</text>
  <text x="40" y="519" font-size="12" fill="#111" text-anchor="start">edge into a clean 3.3 V pulse into U3. U3 holds EN low, takes SCS low and raises EN so the part latches SPI,</text>
  <text x="40" y="538" font-size="12" fill="#111" text-anchor="start">then replays the calibration transcript (the configuration is volatile). Splitting LED1/LED2 by sign is O-2.</text>
