<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="ui-sans-serif,sans-serif">
  <rect width="960" height="520" fill="#f7f4ee"/>
  <text x="24" y="32" font-size="16" fill="#111" text-anchor="start">08 — Burden chart</text>
  <text x="24" y="52" font-size="12" fill="#444" text-anchor="start">Voltage-circuit draw of revision B against the 2 W IEC 62052-11 cap and the 1.5 W field target. EC-SEAL1 rev B, doc-1.3.</text>
  <text x="250" y="118" font-size="12" fill="#111" text-anchor="end">logic at 12 V (30 mA)</text>
  <rect x="260" y="100" width="109.021" height="26" fill="#cfc6b4" stroke="#111" stroke-width="1"/>
  <text x="377.021" y="118" font-size="11" fill="#111" text-anchor="start">0.36 W</text>
  <text x="250" y="162" font-size="12" fill="#111" text-anchor="end">radio at 12 V (≤ 40 mA avg)</text>
  <rect x="260" y="144" width="145.361" height="26" fill="#cfc6b4" stroke="#111" stroke-width="1"/>
  <text x="413.361" y="162" font-size="11" fill="#111" text-anchor="start">0.48 W</text>
  <text x="250" y="206" font-size="12" fill="#111" text-anchor="end">buck loss at 60 %</text>
  <rect x="260" y="188" width="169.588" height="26" fill="#cfc6b4" stroke="#111" stroke-width="1"/>
  <text x="437.588" y="206" font-size="11" fill="#111" text-anchor="start">0.57 W</text>
  <text x="250" y="250" font-size="12" fill="#111" text-anchor="end">divider string</text>
  <rect x="260" y="232" width="8.65298" height="26" fill="#cfc6b4" stroke="#111" stroke-width="1"/>
  <text x="276.653" y="250" font-size="11" fill="#111" text-anchor="start">0.03 W</text>
  <text x="250" y="294" font-size="12" fill="#111" text-anchor="end">sign, 19 mJ per kWh</text>
  <rect x="260" y="276" width="1" height="26" fill="#cfc6b4" stroke="#111" stroke-width="1"/>
  <text x="269" y="294" font-size="11" fill="#111" text-anchor="start">≈ 0 W average</text>
  <text x="250" y="348" font-size="12" fill="#111" text-anchor="end" font-weight="600">total, radio transmitting</text>
  <rect x="260" y="330" width="432.622" height="26" fill="#8f7f63" stroke="#111" stroke-width="1"/>
  <text x="684.622" y="348" font-size="11" fill="#fff" text-anchor="end" font-weight="600">1.44 W</text>
  <line x1="710" y1="84" x2="710" y2="370" stroke="#444" stroke-width="1.4"/>
  <text x="710" y="78" font-size="11" fill="#444" text-anchor="middle">1.5 W field target</text>
  <line x1="860" y1="84" x2="860" y2="370" stroke="#a33" stroke-width="1.4"/>
  <text x="860" y="78" font-size="11" fill="#a33" text-anchor="middle">2 W cap</text>
  <text x="40" y="420" font-size="12" fill="#111" text-anchor="start">Radio asleep: 0.63 W. The shunt is the current circuit: 0.16 W at 40 A, a separate 1 VA-at-nominal limit.</text>
  <text x="40" y="439" font-size="12" fill="#111" text-anchor="start">Signing once per kWh costs 5.3 × 10⁻⁹ of the energy it attests; it does not move a bar.</text>
  <text x="40" y="458" font-size="12" fill="#111" text-anchor="start">Efficiency, logic current and radio average are the budget figures in CIRCUITS.md (open item O-4 confirms them).</text>
</svg>
